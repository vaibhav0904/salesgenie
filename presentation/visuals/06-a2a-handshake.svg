<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 380" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="380" fill="#FAF9F7"/>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6E6A63"/></marker></defs>
  <text x="480" y="40" text-anchor="middle" fill="#20242B" font-size="20" font-weight="700">Two companies’ AIs do business — with a human hand still on the pen</text>
  <!-- actors -->
  <rect x="40" y="70" width="220" height="60" rx="10" fill="#DFE8F2" stroke="#3D6C9E" stroke-width="2"/>
  <text x="150" y="96" text-anchor="middle" fill="#3D6C9E" font-size="15" font-weight="700">🤖 the buyer’s AI</text>
  <text x="150" y="118" text-anchor="middle" fill="#6E6A63" font-size="12">“find us 25 good chairs”</text>
  <rect x="700" y="70" width="220" height="60" rx="10" fill="#F4E3D7" stroke="#B4551D" stroke-width="2"/>
  <text x="810" y="96" text-anchor="middle" fill="#B4551D" font-size="15" font-weight="700">🏪 the seller’s AI</text>
  <text x="810" y="118" text-anchor="middle" fill="#6E6A63" font-size="12">same assembly line behind it</text>
  <line x1="150" y1="130" x2="150" y2="340" stroke="#C9C5BD" stroke-width="2"/>
  <line x1="810" y1="130" x2="810" y2="340" stroke="#C9C5BD" stroke-width="2"/>
  <!-- exchanges -->
  <g font-size="13.5">
    <line x1="160" y1="165" x2="800" y2="165" stroke="#6E6A63" stroke-width="2" marker-end="url(#a)"/>
    <text x="480" y="156" text-anchor="middle" fill="#20242B">reads the public “business card for AIs”, sends the enquiry</text>
    <line x1="800" y1="205" x2="160" y2="205" stroke="#6E6A63" stroke-width="2" marker-end="url(#a)"/>
    <text x="480" y="196" text-anchor="middle" fill="#20242B">“accepted — being worked on” (internals stay private)</text>
    <line x1="800" y1="258" x2="160" y2="258" stroke="#B4551D" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="480" y="234" text-anchor="middle" fill="#B4551D" font-weight="700">“a HUMAN is reviewing the offer” — the gate is visible,</text>
    <text x="480" y="250" text-anchor="middle" fill="#B4551D" font-weight="700">and the buyer’s AI waits for it</text>
    <line x1="800" y1="310" x2="160" y2="310" stroke="#2E7D53" stroke-width="2.5" marker-end="url(#a)"/>
    <text x="480" y="298" text-anchor="middle" fill="#2E7D53" font-weight="700">approved offer: a friendly letter + tidy data its systems can file</text>
  </g>
  <text x="480" y="358" text-anchor="middle" fill="#6E6A63" font-size="13.5">Nobody on either side read or wrote an email. The seller was open at 2 a.m.</text>
</svg>
