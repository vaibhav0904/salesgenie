<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 500" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="500" fill="#FAF9F7"/>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6E6A63"/></marker></defs>
  <!-- control room -->
  <rect x="260" y="28" width="440" height="92" rx="10" fill="#DFE8F2" stroke="#3D6C9E" stroke-width="2"/>
  <text x="480" y="58" text-anchor="middle" fill="#3D6C9E" font-size="17" font-weight="700">THE CONTROL ROOM — a chat window</text>
  <text x="480" y="82" text-anchor="middle" fill="#20242B" font-size="14">the owner sets up and runs everything by talking</text>
  <text x="480" y="103" text-anchor="middle" fill="#6E6A63" font-size="12.5">“set up my shop” · “what’s pending?” · “approve it”</text>
  <!-- assembly line -->
  <rect x="260" y="168" width="440" height="150" rx="10" fill="#FFFFFF" stroke="#C9C5BD" stroke-width="2"/>
  <text x="480" y="198" text-anchor="middle" fill="#20242B" font-size="17" font-weight="700">ONE ASSEMBLY LINE — for every business</text>
  <text x="480" y="226" text-anchor="middle" fill="#20242B" font-size="14">read → pull out the facts → score → match real stock → draft</text>
  <text x="480" y="256" text-anchor="middle" fill="#B4551D" font-size="15" font-weight="700">→ a human clicks Approve → only then it is sent</text>
  <text x="480" y="286" text-anchor="middle" fill="#6E6A63" font-size="12.5">plus: Monday report · error catcher · AI quality-examiner</text>
  <!-- doors -->
  <rect x="30" y="168" width="190" height="62" rx="10" fill="#F4E3D7" stroke="#B4551D" stroke-width="2"/>
  <text x="125" y="194" text-anchor="middle" fill="#B4551D" font-size="15" font-weight="700">Door 1 · Email</text>
  <text x="125" y="215" text-anchor="middle" fill="#6E6A63" font-size="12.5">customers write in</text>
  <rect x="30" y="252" width="190" height="62" rx="10" fill="#F4E3D7" stroke="#B4551D" stroke-width="2"/>
  <text x="125" y="278" text-anchor="middle" fill="#B4551D" font-size="15" font-weight="700">Door 2 · Any channel</text>
  <text x="125" y="299" text-anchor="middle" fill="#6E6A63" font-size="12.5">website forms, apps…</text>
  <rect x="740" y="168" width="190" height="150" rx="10" fill="#DFE8F2" stroke="#3D6C9E" stroke-width="2"/>
  <text x="835" y="198" text-anchor="middle" fill="#3D6C9E" font-size="15" font-weight="700">Door 3 · Other</text>
  <text x="835" y="218" text-anchor="middle" fill="#3D6C9E" font-size="15" font-weight="700">companies’ AIs</text>
  <text x="835" y="245" text-anchor="middle" fill="#20242B" font-size="12.5">a buyer’s AI enquires</text>
  <text x="835" y="263" text-anchor="middle" fill="#20242B" font-size="12.5">and gets a quote —</text>
  <text x="835" y="286" text-anchor="middle" fill="#6E6A63" font-size="12">it even sees “a human is</text>
  <text x="835" y="303" text-anchor="middle" fill="#6E6A63" font-size="12">reviewing your offer”</text>
  <!-- ledger -->
  <rect x="260" y="376" width="440" height="84" rx="10" fill="#FFFFFF" stroke="#20242B" stroke-width="2.5"/>
  <text x="480" y="410" text-anchor="middle" fill="#20242B" font-size="17" font-weight="700">THE LEDGER — everything is written down</text>
  <text x="480" y="437" text-anchor="middle" fill="#6E6A63" font-size="12.5">every enquiry, decision, AI action, approval — permanent and checkable</text>
  <!-- arrows -->
  <line x1="480" y1="120" x2="480" y2="164" stroke="#6E6A63" stroke-width="2" marker-end="url(#a)"/>
  <line x1="220" y1="199" x2="256" y2="214" stroke="#6E6A63" stroke-width="2" marker-end="url(#a)"/>
  <line x1="220" y1="283" x2="256" y2="268" stroke="#6E6A63" stroke-width="2" marker-end="url(#a)"/>
  <line x1="738" y1="243" x2="704" y2="243" stroke="#6E6A63" stroke-width="2" marker-end="url(#a)"/>
  <line x1="480" y1="318" x2="480" y2="372" stroke="#6E6A63" stroke-width="2" marker-end="url(#a)"/>
</svg>
