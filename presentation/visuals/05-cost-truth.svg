<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="300" fill="#FAF9F7"/>
  <text x="480" y="42" text-anchor="middle" fill="#20242B" font-size="20" font-weight="700">Estimates lie, meters don’t — the cost-per-enquiry correction</text>
  <!-- bars: estimate tiny, exact big -->
  <g>
    <rect x="150" y="196" width="240" height="12" rx="4" fill="#6E6A63"/>
    <text x="270" y="182" text-anchor="middle" fill="#6E6A63" font-size="14" font-weight="600">what my estimate said</text>
    <text x="270" y="234" text-anchor="middle" fill="#20242B" font-size="16" font-weight="700">$0.0002</text>
    <rect x="570" y="86" width="240" height="122" rx="6" fill="#B4551D"/>
    <text x="690" y="72" text-anchor="middle" fill="#B4551D" font-size="14" font-weight="600">what the meter reads</text>
    <text x="690" y="234" text-anchor="middle" fill="#20242B" font-size="16" font-weight="700">$0.0074  (₹0.62)</text>
  </g>
  <text x="480" y="150" text-anchor="middle" fill="#20242B" font-size="26" font-weight="800">36×</text>
  <text x="480" y="172" text-anchor="middle" fill="#6E6A63" font-size="13">off</text>
  <text x="480" y="272" text-anchor="middle" fill="#6E6A63" font-size="14">Why? AI models “think” silently before answering — and every thought is billed. Text-length estimates can’t see thinking.</text>
</svg>
