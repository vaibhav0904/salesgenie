<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="320" fill="#FAF9F7"/>
  <defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" fill="#6E6A63"/></marker></defs>
  <text x="480" y="42" text-anchor="middle" fill="#20242B" font-size="20" font-weight="700">Why it cannot invent a product — two locks</text>
  <!-- lock 1 -->
  <rect x="40" y="90" width="260" height="140" rx="10" fill="#FFFFFF" stroke="#3D6C9E" stroke-width="2.5"/>
  <text x="170" y="122" text-anchor="middle" fill="#3D6C9E" font-size="16" font-weight="700">🔒 Lock 1 — before the AI</text>
  <text x="170" y="150" text-anchor="middle" fill="#20242B" font-size="13.5">the ledger is asked first:</text>
  <text x="170" y="170" text-anchor="middle" fill="#20242B" font-size="13.5">“what is really in stock,</text>
  <text x="170" y="190" text-anchor="middle" fill="#20242B" font-size="13.5">matching this need &amp; budget?”</text>
  <text x="170" y="215" text-anchor="middle" fill="#6E6A63" font-size="12.5">the AI only ever sees this shortlist</text>
  <!-- middle -->
  <rect x="360" y="105" width="220" height="110" rx="10" fill="#F4E3D7" stroke="#B4551D" stroke-width="2.5"/>
  <text x="470" y="140" text-anchor="middle" fill="#B4551D" font-size="16" font-weight="700">the AI picks 2–3</text>
  <text x="470" y="165" text-anchor="middle" fill="#20242B" font-size="13.5">from the shortlist only,</text>
  <text x="470" y="185" text-anchor="middle" fill="#20242B" font-size="13.5">with a reason for each</text>
  <!-- lock 2 -->
  <rect x="640" y="90" width="280" height="140" rx="10" fill="#FFFFFF" stroke="#3D6C9E" stroke-width="2.5"/>
  <text x="780" y="122" text-anchor="middle" fill="#3D6C9E" font-size="16" font-weight="700">🔒 Lock 2 — after the AI</text>
  <text x="780" y="150" text-anchor="middle" fill="#20242B" font-size="13.5">every pick is checked again</text>
  <text x="780" y="170" text-anchor="middle" fill="#20242B" font-size="13.5">against live stock at the moment</text>
  <text x="780" y="190" text-anchor="middle" fill="#20242B" font-size="13.5">of saving — fakes cannot survive</text>
  <text x="780" y="215" text-anchor="middle" fill="#6E6A63" font-size="12.5">nothing suitable? it honestly says so</text>
  <line x1="300" y1="160" x2="356" y2="160" stroke="#6E6A63" stroke-width="2" marker-end="url(#a)"/>
  <line x1="580" y1="160" x2="636" y2="160" stroke="#6E6A63" stroke-width="2" marker-end="url(#a)"/>
  <text x="480" y="282" text-anchor="middle" fill="#2E7D53" font-size="17" font-weight="700">Result: 39 of 39 recommendations ever made — real and in stock. 100%.</text>
</svg>
